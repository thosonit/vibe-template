<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — AUTH-user-auth prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #1db954;
        --primary-hover: #17a34a;
        --primary-active: #12873c;
        --on-primary: #0b0f0d;

        --ink: #121212;
        --ink-secondary: #4b4f4e;
        --ink-tertiary: #8a8f8d;

        --paper: #fafaf8;
        --surface: #ffffff;
        --surface-sunken: #f1f2f0;
        --border: #e3e4e1;
        --border-strong: #c7c9c5;

        --success: #0f7a3d;
        --success-bg: #e7f7ed;
        --warning: #7a5900;
        --warning-bg: #fbf3dd;
        --error: #a83a30;
        --error-bg: #fbeae8;

        --display: "Fraunces", Georgia, "Times New Roman", serif;
        --text: "Inter", -apple-system, "Segoe UI", sans-serif;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 16px;
        --radius-full: 999px;

        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 40px;

        --shadow-raised:
          0 1px 2px rgba(18, 18, 18, 0.04), 0 4px 12px rgba(18, 18, 18, 0.06);
        --shadow-floating:
          0 4px 8px rgba(18, 18, 18, 0.06), 0 16px 32px rgba(18, 18, 18, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--text);
        background: var(--paper);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: var(--space-lg);
      }

      .card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-raised);
        width: 100%;
        max-width: 380px;
        padding: var(--space-xl) var(--space-lg);
      }

      .logo {
        text-align: center;
        font-family: var(--display);
        font-weight: 600;
        font-size: 1.0625rem;
        letter-spacing: 0.01em;
        color: var(--ink);
        margin-bottom: var(--space-lg);
      }

      h1 {
        font-family: var(--display);
        font-weight: 500;
        font-size: 1.75rem;
        line-height: 1.2;
        text-align: center;
        margin: 0 0 var(--space-lg);
        color: var(--ink);
      }

      .banner {
        display: none;
        align-items: flex-start;
        gap: var(--space-sm);
        border-radius: var(--radius-md);
        padding: var(--space-sm) var(--space-md);
        font-size: 0.875rem;
        line-height: 1.45;
        margin-bottom: var(--space-md);
      }
      .banner.visible {
        display: flex;
      }
      .banner-error {
        background: var(--error-bg);
        color: var(--error);
      }
      .banner-success {
        background: var(--success-bg);
        color: var(--success);
      }
      .banner .icon {
        flex-shrink: 0;
        margin-top: 2px;
      }
      .banner-content {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }
      .banner-action {
        display: inline;
        align-self: flex-start;
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-weight: 600;
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: var(--space-xs);
      }

      .field-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink-secondary);
      }

      .field-input {
        width: 100%;
        height: 44px;
        font-family: var(--text);
        font-size: 1rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        padding: 0 var(--space-md);
      }
      .field-input::placeholder {
        color: var(--ink-tertiary);
      }
      .field-input:focus-visible {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.18);
      }
      .field-input.has-error {
        border-color: var(--error);
      }
      .field-input.has-error:focus-visible {
        box-shadow: 0 0 0 3px rgba(168, 58, 48, 0.14);
      }
      .field-input:disabled {
        background: var(--surface-sunken);
        color: var(--ink-tertiary);
      }

      .password-wrap {
        position: relative;
      }
      .password-wrap .field-input {
        padding-right: 44px;
      }
      .toggle-visibility {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        color: var(--ink-tertiary);
      }
      .toggle-visibility:hover {
        background: var(--surface-sunken);
        color: var(--ink);
      }
      .toggle-visibility:focus-visible {
        outline: 2px solid var(--primary-active);
        outline-offset: 2px;
      }

      .remember-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        font-size: 0.9375rem;
        color: var(--ink);
      }
      .checkbox {
        width: 20px;
        height: 20px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
        padding: 0;
      }
      .checkbox:focus-visible {
        outline: 2px solid var(--primary-active);
        outline-offset: 2px;
      }
      .checkbox.checked {
        background: var(--primary);
        border-color: var(--primary);
      }
      .checkbox .icon {
        width: 13px;
        height: 13px;
        stroke: var(--on-primary);
        stroke-width: 3;
        display: none;
      }
      .checkbox.checked .icon {
        display: block;
      }
      .remember-row label {
        cursor: pointer;
      }

      .btn-primary {
        width: 100%;
        height: 44px;
        border: none;
        border-radius: var(--radius-full);
        background: var(--primary);
        color: var(--on-primary);
        font-family: var(--text);
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        transition: background-color 150ms ease;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-primary:active {
        background: var(--primary-active);
      }
      .btn-primary:focus-visible {
        outline: 2px solid var(--primary-active);
        outline-offset: 2px;
      }
      .btn-primary:disabled {
        background: var(--border);
        color: var(--ink-tertiary);
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(11, 15, 13, 0.35);
        border-top-color: var(--on-primary);
        border-radius: var(--radius-full);
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .forgot-link {
        display: block;
        text-align: center;
        margin-top: var(--space-md);
        font-size: 0.8125rem;
        color: var(--ink-secondary);
        text-decoration: underline;
        text-decoration-color: var(--border-strong);
        text-underline-offset: 3px;
      }
      .forgot-link:hover {
        color: var(--ink);
      }

      .icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
        flex-shrink: 0;
      }

      @media (max-width: 420px) {
        body {
          padding: var(--space-md);
        }
        .card {
          padding: var(--space-lg) var(--space-md);
        }
      }

      /* ---------- Floating state-preview panel (prototype-only, not part of the design system) ---------- */
      .state-control {
        position: fixed;
        bottom: var(--space-md);
        right: var(--space-md);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-floating);
        font-size: 0.8125rem;
        z-index: 10;
        max-width: 220px;
      }
      .state-control summary {
        list-style: none;
        cursor: pointer;
        padding: var(--space-sm) var(--space-md);
        font-weight: 600;
        color: var(--ink-secondary);
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      .state-control summary::-webkit-details-marker {
        display: none;
      }
      .state-control[open] summary {
        border-bottom: 1px solid var(--border);
      }
      .state-control-body {
        padding: var(--space-xs);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .state-control-body button {
        text-align: left;
        border: none;
        background: none;
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-sm);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .state-control-body button:hover {
        background: var(--surface-sunken);
      }
      .state-control-body button.is-active {
        background: var(--primary);
        color: var(--on-primary);
      }

      @media print {
        .state-control {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path
          d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
        />
        <path
          d="M6.61 6.61C3.06 8.94 2 12 2 12s3.5 7 10 7a9.26 9.26 0 0 0 5.39-1.61"
        />
        <path d="M2 2l20 20" />
        <path d="M9.53 9.53a3 3 0 0 0 4.24 4.24" />
      </symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24">
        <path
          d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
        />
        <path d="M12 9v4M12 17h.01" />
      </symbol>
    </svg>

    <form class="card" id="login-form" onsubmit="return false;">
      <div class="logo">ACME</div>
      <h1>Log in</h1>

      <div
        class="banner banner-error"
        id="banner"
        role="alert"
        aria-live="polite"
        tabindex="-1"
      >
        <svg class="icon"><use href="#i-alert-triangle" /></svg>
        <div class="banner-content">
          <span id="banner-text"></span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input
          class="field-input"
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="you@company.com"
        />
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="password-wrap">
          <input
            class="field-input"
            type="password"
            id="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="toggle-visibility"
            onclick="togglePasswordVisibility()"
            aria-label="Show password"
          >
            <svg class="icon"><use href="#i-eye" /></svg>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <button
          type="button"
          class="checkbox"
          id="remember-box"
          role="checkbox"
          aria-checked="false"
          aria-labelledby="remember-label"
          onclick="toggleRemember()"
        >
          <svg class="icon"><use href="#i-check" /></svg>
        </button>
        <label id="remember-label" onclick="toggleRemember()"
          >Remember me</label
        >
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">
        Log in
      </button>
      <a href="#" class="forgot-link">Forgot password?</a>
    </form>

    <!-- Floating, collapsible state-preview panel — prototype affordance only, not part of the shipped UI -->
    <details class="state-control">
      <summary>Preview state</summary>
      <div class="state-control-body" id="state-list">
        <button type="button" data-state="default" class="is-active">
          Default
        </button>
        <button type="button" data-state="loading">Loading</button>
        <button type="button" data-state="invalid">Invalid credentials</button>
        <button type="button" data-state="locked">Account locked</button>
        <button type="button" data-state="unverified">
          Unverified email
        </button>
        <button type="button" data-state="ratelimited">Rate limited</button>
        <button type="button" data-state="network">
          Network / unknown error
        </button>
        <button type="button" data-state="success">
          Success (transient)
        </button>
      </div>
    </details>

    <script>
      function togglePasswordVisibility() {
        const input = document.getElementById("password");
        const btn = document.querySelector(".toggle-visibility");
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        btn.setAttribute(
          "aria-label",
          isHidden ? "Hide password" : "Show password",
        );
        btn.innerHTML = `<svg class="icon"><use href="#i-${isHidden ? "eye-off" : "eye"}"/></svg>`;
      }

      function toggleRemember() {
        const box = document.getElementById("remember-box");
        const checked = !(box.getAttribute("aria-checked") === "true");
        box.setAttribute("aria-checked", String(checked));
        box.classList.toggle("checked", checked);
      }

      const states = {
        default: { message: null },
        loading: { message: null },
        invalid: {
          type: "error",
          message: "Email or password is incorrect.",
          markFieldsInvalid: true,
          clearPassword: true,
        },
        locked: {
          type: "error",
          message:
            "Your account is temporarily locked. Try again in 12 minutes.",
        },
        unverified: {
          type: "error",
          message: "Please verify your email before logging in.",
          action: "Resend verification email",
        },
        ratelimited: {
          type: "error",
          message: "Too many attempts, please try again shortly.",
        },
        network: {
          type: "error",
          message: "Something went wrong. Please try again.",
        },
        success: {
          type: "success",
          message: "Logged in — redirecting…",
        },
      };

      function setState(state) {
        const banner = document.getElementById("banner");
        const bannerText = document.getElementById("banner-text");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const submitBtn = document.getElementById("submit-btn");
        const fields = document.querySelectorAll(".field-input");
        const config = states[state];

        banner.classList.remove("visible", "banner-error", "banner-success");
        banner.innerHTML =
          '<svg class="icon"><use href="#i-alert-triangle"/></svg><div class="banner-content"><span id="banner-text"></span></div>';
        email.classList.remove("has-error");
        password.classList.remove("has-error");
        fields.forEach((f) => (f.disabled = false));
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Log in";

        document
          .querySelectorAll(".state-control-body button")
          .forEach((b) => b.classList.toggle("is-active", b.dataset.state === state));

        if (state === "loading") {
          fields.forEach((f) => (f.disabled = true));
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';
          return;
        }

        if (!config.message) return;

        banner.classList.add(
          "visible",
          config.type === "success" ? "banner-success" : "banner-error",
        );
        banner.querySelector("#banner-text").textContent = config.message;
        if (config.action) {
          const actionBtn = document.createElement("button");
          actionBtn.type = "button";
          actionBtn.className = "banner-action";
          actionBtn.textContent = config.action;
          banner.querySelector(".banner-content").appendChild(actionBtn);
        }

        if (config.markFieldsInvalid) {
          email.classList.add("has-error");
          password.classList.add("has-error");
        }
        if (config.clearPassword) {
          password.value = "";
        }
        if (state !== "success") {
          banner.focus();
        }
      }

      document
        .getElementById("state-list")
        .addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-state]");
          if (btn) setState(btn.dataset.state);
        });
    </script>
  </body>
</html>
