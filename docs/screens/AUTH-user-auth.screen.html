<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — AUTH-user-auth prototype</title>
    <style>
      :root {
        --primary: #003469;
        --primary-hover: #00284f;
        --primary-active: #001d38;
        --on-primary: #ffffff;
        --accent: #f5a623;
        --accent-hover: #db9110;
        --on-accent: #1a1a1a;
        --success: #1e9e5a;
        --success-bg: #e6f6ed;
        --warning: #f0a500;
        --warning-bg: #fff6e0;
        --error: #d64545;
        --error-bg: #fceaea;
        --info: #2e7fd6;
        --info-bg: #e9f2fc;
        --background: #f7f8fa;
        --surface: #ffffff;
        --border: #e1e4e8;
        --text-primary: #111827;
        --text-secondary: #5b6472;
        --text-disabled: #9ca3af;

        --rounded-sm: 4px;
        --rounded-md: 8px;
        --rounded-lg: 12px;
        --rounded-full: 999px;

        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 12px;
        --space-lg: 16px;
        --space-xl: 24px;
        --space-2xl: 32px;
        --space-3xl: 48px;

        --shadow-sm:
          0 1px 2px rgba(17, 24, 39, 0.06), 0 1px 3px rgba(17, 24, 39, 0.08);
        --shadow-lg:
          0 12px 24px rgba(17, 24, 39, 0.12), 0 4px 8px rgba(17, 24, 39, 0.08);

        --icon-sm: 16px;
        --icon-md: 20px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--background);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: var(--space-xl);
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      /* State picker — not part of the design system, just a demo affordance */
      .state-picker {
        max-width: 380px;
        width: 100%;
        margin: 0 auto var(--space-md);
        display: flex;
        gap: var(--space-xs);
        flex-wrap: wrap;
        justify-content: center;
      }
      .state-picker button {
        font-size: 12px;
        padding: var(--space-xs) var(--space-md);
        border-radius: var(--rounded-full);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        cursor: pointer;
      }
      .state-picker button:hover {
        color: var(--text-primary);
        background: var(--background);
      }

      .card {
        background: var(--surface);
        border-radius: var(--rounded-lg);
        box-shadow: var(--shadow-sm);
        width: 100%;
        max-width: 380px;
        padding: var(--space-2xl) var(--space-xl);
      }

      .logo {
        text-align: center;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.02em;
        color: var(--primary);
        margin-bottom: var(--space-lg);
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 var(--space-xl);
        color: var(--text-primary);
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--space-xs);
      }

      .field {
        margin-bottom: var(--space-lg);
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        height: 40px;
        padding: 0 var(--space-md);
        border: 1px solid var(--border);
        border-radius: var(--rounded-sm);
        background: var(--surface);
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
      }
      input::placeholder {
        color: var(--text-disabled);
      }
      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 52, 105, 0.12);
      }
      input.input-error {
        border-color: var(--error);
      }
      input.input-error:focus {
        box-shadow: 0 0 0 3px rgba(214, 69, 69, 0.12);
      }

      .password-wrap {
        position: relative;
      }
      .password-wrap input {
        padding-right: 40px;
      }
      .toggle-visibility {
        position: absolute;
        right: var(--space-xs);
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        border-radius: var(--rounded-md);
        cursor: pointer;
        color: var(--text-secondary);
      }
      .toggle-visibility:hover {
        background: var(--background);
        color: var(--text-primary);
      }

      .remember-row {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: var(--space-lg);
        font-size: 14px;
        color: var(--text-primary);
      }
      .checkbox-box {
        width: 18px;
        height: 18px;
        border: 1px solid var(--border);
        border-radius: var(--rounded-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
      }
      .checkbox-box.checked {
        background: var(--primary);
        border-color: var(--primary);
      }
      .checkbox-box.checked .icon {
        width: 12px;
        height: 12px;
        stroke: var(--on-primary);
        stroke-width: 3;
      }

      .error-banner {
        display: none;
        align-items: flex-start;
        gap: var(--space-sm);
        background: var(--error-bg);
        color: var(--error);
        border-radius: var(--rounded-md);
        padding: var(--space-sm) var(--space-md);
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: var(--space-lg);
      }
      .error-banner.visible {
        display: flex;
      }
      .error-banner .icon {
        flex-shrink: 0;
        margin-top: 1px;
      }

      .btn-primary {
        width: 100%;
        height: 40px;
        border: none;
        border-radius: var(--rounded-md);
        background: var(--primary);
        color: var(--on-primary);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-xs);
        transition: background-color 150ms ease;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-primary:active {
        background: var(--primary-active);
      }
      .btn-primary:disabled {
        background: var(--border);
        color: var(--text-disabled);
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: var(--on-primary);
        border-radius: var(--rounded-full);
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .forgot-link {
        display: block;
        text-align: center;
        margin-top: var(--space-lg);
        font-size: 13px;
        color: var(--primary);
        text-decoration: none;
      }
      .forgot-link:hover {
        text-decoration: underline;
      }

      .icon {
        width: var(--icon-md);
        height: var(--icon-md);
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
        flex-shrink: 0;
      }
      .icon-sm {
        width: var(--icon-sm);
        height: var(--icon-sm);
      }

      @media (max-width: 420px) {
        body {
          padding: var(--space-md);
        }
        .card {
          padding: var(--space-xl) var(--space-lg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Lucide icon sprite (inline, outline style, currentColor) -->
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path
          d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
        />
        <path
          d="M6.61 6.61C3.06 8.94 2 12 2 12s3.5 7 10 7a9.26 9.26 0 0 0 5.39-1.61"
        />
        <path d="M2 2l20 20" />
        <path d="M9.53 9.53a3 3 0 0 0 4.24 4.24" />
      </symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24">
        <path
          d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
        />
        <path d="M12 9v4M12 17h.01" />
      </symbol>
    </svg>

    <div class="wrapper">
      <div class="state-picker">
        <button type="button" onclick="setState('default')">Default</button>
        <button type="button" onclick="setState('invalid')">
          Invalid credentials
        </button>
        <button type="button" onclick="setState('locked')">
          Account locked
        </button>
        <button type="button" onclick="setState('unverified')">
          Unverified email
        </button>
        <button type="button" onclick="setState('ratelimited')">
          Rate limited
        </button>
        <button type="button" onclick="setState('loading')">Loading</button>
      </div>

      <form class="card" id="login-form" onsubmit="return false;">
        <div class="logo">ACME</div>
        <h1>Log in</h1>

        <div
          class="error-banner"
          id="error-banner"
          role="alert"
          aria-live="polite"
        >
          <svg class="icon icon-sm"><use href="#i-alert-triangle" /></svg>
          <span id="error-text"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="you@company.com"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="toggle-visibility"
              onclick="togglePassword()"
              aria-label="Show password"
            >
              <svg class="icon icon-sm"><use href="#i-eye" /></svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <span
            class="checkbox-box"
            id="remember-box"
            onclick="toggleRemember()"
          >
            <svg class="icon" style="display: none">
              <use href="#i-check" />
            </svg>
          </span>
          <label
            for="remember"
            style="margin: 0; cursor: pointer"
            onclick="toggleRemember()"
            >Remember me</label
          >
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          Log in
        </button>
        <a href="#" class="forgot-link">Forgot password?</a>
      </form>
    </div>

    <script>
      function togglePassword() {
        const input = document.getElementById("password");
        const btn = document.querySelector(".toggle-visibility");
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        btn.setAttribute(
          "aria-label",
          isHidden ? "Hide password" : "Show password",
        );
        btn.innerHTML = `<svg class="icon icon-sm"><use href="#i-${isHidden ? "eye-off" : "eye"}"/></svg>`;
      }

      function toggleRemember() {
        const box = document.getElementById("remember-box");
        const checked = box.classList.toggle("checked");
        box.querySelector("svg").style.display = checked ? "inline" : "none";
      }

      const messages = {
        default: null,
        invalid: "Email or password is incorrect.",
        locked: "Your account is temporarily locked. Try again in 12 minutes.",
        unverified: "Please verify your email before logging in.",
        ratelimited: "Too many attempts, please try again shortly.",
      };

      function setState(state) {
        const banner = document.getElementById("error-banner");
        const errorText = document.getElementById("error-text");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const submitBtn = document.getElementById("submit-btn");

        email.classList.remove("input-error");
        password.classList.remove("input-error");
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Log in";

        if (state === "loading") {
          banner.classList.remove("visible");
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';
          return;
        }

        const msg = messages[state];
        if (msg) {
          errorText.textContent = msg;
          banner.classList.add("visible");
          if (state === "invalid") {
            password.value = "";
            email.classList.add("input-error");
            password.classList.add("input-error");
          }
        } else {
          banner.classList.remove("visible");
        }
      }
    </script>
  </body>
</html>
